<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pencarian Offline Al-Qur'an</title>
  <style>
    body { font-family: sans-serif; padding: 2em; max-width: 700px; margin: auto; }
    input, button { padding: 0.5em; font-size: 1em; }
    .result { margin-top: 1em; padding: 1em; background: #f5f5f5; border-radius: 8px; }
    .ayat { direction: rtl; font-size: 1.4em; margin-bottom: 0.5em; }
    .label { font-weight: bold; margin-top: 1em; }
  </style>
</head>
<body>

  <h2>Pencarian Offline Ayat Al-Qur'an</h2>
  <input type="text" id="query" placeholder="Contoh: ٱلرَّحْمَـٰنِ" />
  <button onclick="searchQuran()">Cari</button>

  <div id="results"></div>

  <script>
    let quranData = {};

    // Load quran.json
    fetch('quran.json')
      .then(res => res.json())
      .then(data => { quranData = data; });

    function searchQuran() {
      const q = document.getElementById('query').value.trim();
      const results = document.getElementById('results');
      results.innerHTML = '';

      if (!q) return results.innerHTML = 'Masukkan kata pencarian.';

      let found = [];

      for (const surahKey in quranData) {
        const surah = quranData[surahKey];
        const surahName = surah.titleAr + ' (' + surah.titleEn + ')';

        surah.text.forEach(ayat => {
          if (ayat.text.includes(q)) {
            found.push({
              surah: surahName,
              verseNumber: ayat.verseNumber,
              text: ayat.text
            });
          }
        });
      }

      if (found.length === 0) {
        results.innerHTML = '❌ Tidak ditemukan hasil.';
        return;
      }

      results.innerHTML = found.map(r => `
        <div class="result">
          <div class="label">📖 ${r.surah} — Ayat ${r.verseNumber}</div>
          <div class="ayat">${r.text}</div>
        </div>
      `).join('');
    }
  </script>

</body>
</html>
