<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Cari Ayat – alquran-api.pages.dev</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: auto; padding: 2em; }
    input, button { padding: 0.5em; font-size: 1em; }
    .result { margin-top: 1em; padding: 1em; background: #f5f5f5; border-radius: 8px; }
    .ayah-ar { direction: rtl; font-size: 1.5em; margin-top: 0.5em; }
    .ayah-id { font-size: 1em; color: #444; }
  </style>
</head>
<body>

  <h2>Cari Ayat Al-Qur'an (alquran-api.pages.dev)</h2>
  <input type="text" id="keyword" placeholder="Contoh: mercy, الرحمن, kasih" />
  <button onclick="searchQuran()">Cari</button>
  <div id="results"></div>

  <script>
    async function searchQuran() {
      const q = document.getElementById('keyword').value.trim();
      const resDiv = document.getElementById('results');
      resDiv.innerHTML = '';
      if (!q) return resDiv.textContent = '⚠️ Masukkan kata pencarian.';

      resDiv.innerHTML = '🔍 Sedang mencari...';

      try {
        const resp = await fetch(`https://alquran-api.pages.dev/api/quran/search?q=${encodeURIComponent(q)}&lang=id`);
        const json = await resp.json();

        if (!json.results || json.results.length === 0) {
          resDiv.innerHTML = '❌ Tidak ditemukan.';
          return;
        }

        const output = json.results.map(entry => {
          const surah = entry.surah;
          return entry.verses.map(verse => `
            <div class="result">
              <div><strong>📖 ${surah.transliteration} (${surah.name}) — Ayat ${verse.id}</strong></div>
              <div class="ayah-ar">${verse.text}</div>
              <div class="ayah-id">${verse.translation}</div>
            </div>
          `).join('');
        }).join('');

        resDiv.innerHTML = output;

      } catch (err) {
        console.error(err);
        resDiv.innerHTML = '❌ Terjadi kesalahan.';
      }
    }
  </script>

<script>
fetch('https://raw.githubusercontent.com/rioastamal/quran-json/refs/heads/master/surah/10.json')
  .then(res => res.json())
  .then(data => {
    // Loop isi ayat
    for (const no in data.text) {
      const ayat = data.text[no];
      const arti = data.translation[no];
      console.log(`Ayat ${no}: ${ayat}`);
      console.log(`Terjemah: ${arti}`);
    }
  });
</script>

  
</body>
</html>
