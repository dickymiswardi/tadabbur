
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Pencarian Al-Qur'an</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 1em;
    }
    h1 {
      text-align: center;
      color: #007b8a;
    }
    #search-box {
      width: 100%;
      max-width: 600px;
      margin: 1em auto;
      display: flex;
      gap: 0.5em;
    }
    #search-input {
      font-size: 1.2em;
      padding: 0.5em 1em;
      flex: 1;
      border-radius: 6px;
      border: 1px solid #ccc;
      direction: rtl;
    }
    #search-button {
      font-size: 1em;
      padding: 0.6em 1.2em;
      background-color: #007b8a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #search-button:hover {
      background-color: #005f6b;
    }

    #search-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6);
      z-index: 9998;
      display: none;
      justify-content: center;
      align-items: flex-start;
      padding-top: 5vh;
    }

    #search-result-box {
      background-color: #fff;
      width: 90%;
      max-width: 650px;
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 8px;
      padding: 1em;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      z-index: 9999;
    }

    .result-item {
      margin-bottom: 1em;
      padding-bottom: 1em;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-arabic {
      font-size: 1.6em;
      font-family: 'Scheherazade', serif;
      color: #222;
      line-height: 1.8;
    }

    .result-meta {
      font-size: 0.9em;
      color: #555;
    }

    #close-btn {
      background: #d00;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.4em 0.8em;
      margin-bottom: 1em;
      cursor: pointer;
    }

    .no-results {
      text-align: center;
      font-size: 1em;
      color: #777;
      padding-top: 2em;
    }
  </style>
</head>
<body>
  <h1>Pencarian Al-Qur'an</h1>
  <div id="search-box">
    <input type="text" id="search-input" placeholder="Tulis kata Arab tanpa harokat...">
    <button id="search-button">Cari</button>
  </div>

  <div id="search-overlay">
    <div id="search-result-box">
      <button id="close-btn">Tutup</button>
      <div id="search-results"></div>
    </div>
  </div>

<script>
function removeHarokat(text) {
  return text.normalize("NFD").replace(/[ً-ْ]/g, "").replace(/\u06E1/g, "");
}

let quranData = [];

fetch('https://tadabbur.netlify.app/quran.json')
  .then(res => res.json())
  .then(json => {
    quranData = json.flatMap(obj => {
      const keys = Object.keys(obj);
      return keys.map(key => {
        const surah = obj[key];
        return surah.text.map(verse => ({
          surah: surah.titleAr,
          surahEn: surah.titleEn,
          chapter: surah.chapterNumber,
          ayat: verse.verseNumber,
          text: verse.text,
          textClean: removeHarokat(verse.text)
        }));
      });
    }).flat();
  });

const input = document.getElementById("search-input");
const button = document.getElementById("search-button");
const overlay = document.getElementById("search-overlay");
const resultsBox = document.getElementById("search-results");
const closeBtn = document.getElementById("close-btn");

function performSearch() {
  const query = removeHarokat(input.value.trim());
  resultsBox.innerHTML = "";
  overlay.style.display = "flex";

  if (query.length < 2) {
    resultsBox.innerHTML = "<div class='no-results'>Tulis minimal 2 huruf Arab tanpa harokat...</div>";
    return;
  }

  const results = quranData.filter(q => q.textClean.includes(query)).slice(0, 50);

  if (results.length === 0) {
    resultsBox.innerHTML = "<div class='no-results'>Tidak ditemukan.</div>";
    return;
  }

  results.forEach(res => {
    const div = document.createElement("div");
    div.className = "result-item";
    div.innerHTML = `
      <div class="result-arabic">${res.text}</div>
      <div class="result-meta">${res.surah} (${res.surahEn}) - Ayat ${res.ayat}</div>
    `;
    resultsBox.appendChild(div);
  });
}

button.addEventListener("click", performSearch);
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter") performSearch();
});
closeBtn.addEventListener("click", () => {
  overlay.style.display = "none";
  resultsBox.innerHTML = "";
});
</script>
</body>
</html>
