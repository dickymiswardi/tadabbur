function showNoteOverlay(surah, ayah) {
  const noteKey = `note-${surah}-${ayah}`;
  const savedNote = localStorage.getItem(noteKey) || "";

  // Buat backdrop
  const backdrop = document.createElement("div");
  backdrop.id = "note-backdrop";
  backdrop.onclick = () => {
    backdrop.remove();
    overlay.remove();
  };

  // Buat overlay
  const overlay = document.createElement("div");
  overlay.id = "note-overlay";

  // Tombol close
  const closeBtn = document.createElement("div");
  closeBtn.id = "note-overlay-close";
  closeBtn.innerHTML = "&times;";
  closeBtn.onclick = () => {
    backdrop.remove();
    overlay.remove();
  };

  // Konten form
  const title = document.createElement("h3");
  title.textContent = `Catatan untuk Surah ${surahNames[surah]} Ayat ${ayah}`;

  const textarea = document.createElement("textarea");
  textarea.id = "note-textarea";
  textarea.value = savedNote;

  const saveBtn = document.createElement("button");
  saveBtn.id = "save-note-btn";
  saveBtn.textContent = "Simpan Catatan";

  const status = document.createElement("span");
  status.id = "note-status";

  saveBtn.onclick = () => {
    localStorage.setItem(noteKey, textarea.value);
    status.textContent = "✅ Telah Dicatat Offline";
  };

  // Susun elemen
  overlay.appendChild(closeBtn);
  overlay.appendChild(title);
  overlay.appendChild(textarea);
  overlay.appendChild(saveBtn);
  overlay.appendChild(status);

    // Tombol Backup
  const backupBtn = document.createElement("button");
  backupBtn.textContent = "Download All";
  backupBtn.style.marginLeft = "1em";
  backupBtn.onclick = () => {
    const notes = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith("note-")) {
        notes[key] = localStorage.getItem(key);
      }
    }
    const blob = new Blob([JSON.stringify(notes, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "catatan-quran.json";
    a.click();
  };

  // Tombol Restore
  const restoreBtn = document.createElement("button");
  restoreBtn.textContent = "Pulihkan All";
  restoreBtn.style.marginLeft = "0.8em";

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = ".json";
  fileInput.style.display = "none";
  restoreBtn.onclick = () => fileInput.click();

  fileInput.onchange = () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        Object.keys(data).forEach(key => {
          if (key.startsWith("note-")) {
            localStorage.setItem(key, data[key]);
          }
        });
        status.textContent = "✅ Restore selesai! Silakan muat ulang halaman.";
      } catch (e) {
        status.textContent = "❌ Gagal memuat file catatan.";
      }
    };
    reader.readAsText(file);
  };

  // Susun elemen akhir
  overlay.appendChild(closeBtn);
  overlay.appendChild(title);
  overlay.appendChild(textarea);
  overlay.appendChild(saveBtn);
  overlay.appendChild(backupBtn);
  overlay.appendChild(restoreBtn);
    overlay.appendChild(status);
  overlay.appendChild(fileInput);

  document.body.appendChild(backdrop);
  document.body.appendChild(overlay);
}

  if (!log.includes(todayStr)) {
    log.push(todayStr);
    localStorage.setItem(logKey, JSON.stringify(log));
  }

  const hariKe = log.length;

  const infoDiv = document.createElement("div");
  infoDiv.style.textAlign = "center";
  infoDiv.style.fontSize = "1em";
  infoDiv.style.color = "#454545";
  infoDiv.style.marginTop = "0.1em";
  infoDiv.textContent = `Total Waktu Tadabbur: ${hariKe} Hari`;

  const sumberDiv = document.querySelector(".sumber");
  if (sumberDiv && sumberDiv.parentNode) {
    sumberDiv.parentNode.insertBefore(infoDiv, sumberDiv.nextSibling);
  }
})();

// SCRIPT SYNC TOMBOL OVERLAY

  let usernameConfirmed = false;

function resetCheckResult() {
  usernameConfirmed = false;
  document.getElementById('check-result').innerHTML = '';
  document.getElementById('sync-status').innerHTML = '';
}

async function isUsernameTaken(username) {
  const url = `https://raw.githubusercontent.com/dickymiswardi/tadabbur/main/data/${username}.json`;
  const res = await fetch(url);
  return res.ok;
}

async function checkUsername() {
  const el = document.getElementById('sync-username');
  const status = document.getElementById('check-result');
  const username = el.value.trim().toLowerCase();

  if (!/^[a-z0-9_-]+$/.test(username)) {
    status.innerHTML = '<span style=\"color:red\">❌ username harus huruf kecil tanpa spasi</span>';
    return;
  }

  status.innerHTML = '<img src="https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/FadingFountain.gif" width="28" />';
  const taken = await isUsernameTaken(username);

  if (taken) {
    status.innerHTML = `
      <div style=\"color:red\">⚠️ Username sudah ada. Apakah ini milikmu?</div>
      <button onclick=\"confirmUsername(true)\">✅ Lanjutkan</button>
      <button onclick=\"confirmUsername(false)\">❌ Ganti</button>
    `;
  } else {
  confirmUsername(true); // langsung konfirmasi otomatis
}
}

function confirmUsername(ok) {
  const status = document.getElementById('check-result');
  const input = document.getElementById('sync-username');
  const checkBtn = input.nextElementSibling; // tombol Check
  const username = input.value.trim().toLowerCase();

  if (ok) {
    usernameConfirmed = true;
    localStorage.setItem("usernameAktif", username);
    status.innerHTML = '<span style="color:green">✅ Username dikonfirmasi. Mohon diingat.</span>';

    // Sembunyikan input dan tombol Check
    input.style.display = "none";
    if (checkBtn) checkBtn.style.display = "none";

    // Tambahkan label username
    const label = document.createElement("div");
    label.id = "username-label";
    label.innerHTML = `👤 Username: <strong>${username}</strong>`;
    input.parentElement.insertBefore(label, input.nextSibling);

    // Tambahkan tombol Ganti User
    if (!document.getElementById("btn-ganti-user")) {
      const gantiBtn = document.createElement("button");
      gantiBtn.id = "btn-ganti-user";
      gantiBtn.textContent = "🔁 Ganti User";
      gantiBtn.onclick = () => {
        // Kembalikan input dan tombol Check
        localStorage.removeItem("usernameAktif");
        input.style.display = "inline-block";
        if (checkBtn) checkBtn.style.display = "inline-block";
        status.innerHTML = '';
        document.getElementById("username-label")?.remove();
        document.getElementById("btn-ganti-user")?.remove();
        input.value = '';
        input.focus();
        usernameConfirmed = false;
      };
      input.parentElement.appendChild(gantiBtn);
    }

  } else {
    input.value = '';
    usernameConfirmed = false;
    status.innerHTML = '<span style="color:gray">Silakan isi username baru</span>';
  }
}

  // ⬆️ Fungsi Upload (satu arah ke Cloud)

async function uploadDataToCloud() {
  const username = localStorage.getItem('usernameAktif');
  const status = document.getElementById('sync-status');
  status.innerHTML = '';

  if (!username || !/^[a-z0-9_-]+$/.test(username)) {
    status.innerHTML = '<span style="color:red">❌ Username tidak valid.</span>';
    return;
  }

  try {
    const localBookmark = JSON.parse(localStorage.getItem('tadabbur-bookmark') || '[]');
    const localLog = JSON.parse(localStorage.getItem('tadabbur-log') || '[]');
    const localNotes = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('note-')) localNotes[k] = localStorage.getItem(k);
    }

    const payload = {
      bookmark: localBookmark,
      notes: localNotes,
      log: localLog
    };

    status.innerHTML = '⬆️ Upload <img src="https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/FadingFountain.gif" width="50" />';
    await fetch('/.netlify/functions/sync', {
      method: 'POST',
      body: JSON.stringify({ username, data: payload })
    });

    status.innerHTML = '<span style="color:green">✅ Upload berhasil!</span>';
  } catch (err) {
    console.error(err);
    status.innerHTML = '<span style="color:red">❌ Upload gagal.</span>';
  }
}

 // ⬇️ Fungsi Download (satu arah dari Cloud)

  async function downloadDataFromCloud() {
  const username = localStorage.getItem('usernameAktif');
  const status = document.getElementById('sync-status');
  status.innerHTML = '';

  if (!username || !/^[a-z0-9_-]+$/.test(username)) {
    status.innerHTML = '<span style="color:red">❌ Username tidak valid.</span>';
    return;
  }

  try {
    status.innerHTML = '⬇️ Downloading <img src="https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/FadingFountain.gif" width="50" style="vertical-align:middle; display:inline;" />';
    const url = `https://raw.githubusercontent.com/dickymiswardi/tadabbur/main/data/${username}.json`;
    const response = await fetch(url);
    if (!response.ok) throw new Error("Gagal ambil data");

    const cloudData = await response.json();

    Object.keys(localStorage).forEach(k => {
      if (k.startsWith("note-") || k === "tadabbur-bookmark" || k === "tadabbur-log") {
        localStorage.removeItem(k);
      }
    });

    localStorage.setItem("tadabbur-bookmark", JSON.stringify(cloudData.bookmark || []));
    localStorage.setItem("tadabbur-log", JSON.stringify(cloudData.log || []));
    if (cloudData.notes) {
      Object.keys(cloudData.notes).forEach(k => localStorage.setItem(k, cloudData.notes[k]));
    }

    status.innerHTML = '<span style="color:green">✅ Download berhasil!</span>';
  } catch (err) {
    console.error(err);
    status.innerHTML = '<span style="color:red">❌ Download gagal.</span>';
  }
}
