<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Terjemah Per Kata Al-Qur'an</title>
  <style>
    body {
      background: #fffef8;
      font-family: sans-serif;
      text-align: center;
      padding: 2em;
      direction: rtl;
    }

    #ayah-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1em;
      font-size: 2.2em;
      cursor: pointer;
      user-select: none;
      margin-top: 2em;
    }

    .word-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .glyph {
      font-family: 'QCF_P002', serif;
      font-size: 1em;
      transition: all 0.2s;
    }

    .translation {
      display: none;
      font-size: 0.4em;
      color: #555;
      margin-top: 0.2em;
      transition: all 0.2s;
    }

    .active .translation {
      display: block;
    }

    .active .glyph {
      font-size: 0.9em;
    }

    @font-face {
      font-family: 'QCF_P002';
      src: url('https://dickymiswardi.github.io/tadabbur/QCF_P002.TTF') format('truetype');
    }
  </style>
</head>
<body>

<h2>القرآن الكريم - الترجمة الفورية للكلمات</h2>

<div id="ayah-container">Memuat ayat...</div>

<script>
  const surah = 2;
  const ayah = 2;

  fetch(`https://api.quran.com/api/v4/verses/by_key/${surah}:${ayah}?words=true&translations=33`)
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("ayah-container");
      container.innerHTML = "";

      data.verse.words.forEach(word => {
        const box = document.createElement("div");
        box.className = "word-box";

        const glyph = document.createElement("div");
        glyph.className = "glyph";
        glyph.textContent = word.code_v1 || word.text;

        const trans = document.createElement("div");
        trans.className = "translation";
        trans.textContent = word.translation?.text || "";

        box.appendChild(glyph);
        box.appendChild(trans);
        container.appendChild(box);
      });

      // Tambahkan nomor ayat
      const end = document.createElement("div");
      end.className = "glyph";
      end.textContent = `﴿${ayah}﴾`;
      container.appendChild(end);

      // Toggle terjemah saat klik
      container.addEventListener("click", () => {
        container.classList.toggle("active");
      });
    });
</script>

</body>
</html>
