<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tadabbur Qur'an - Username Setup</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0; padding: 0;
      background: #f9f9f9;
    }
    #username-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #username-box {
      background: white;
      padding: 2em;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      position: relative;
      z-index: 10000;
    }
    #username-box input {
      padding: 0.8em;
      width: 80%;
      margin-bottom: 1em;
      font-size: 1em;
      border-radius: 6px;
      border: 1px solid #ccc;
      text-align: center;
    }
    #username-box button {
      padding: 0.6em 1.2em;
      background: #007b8a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="username-overlay">
  <div id="username-box">
    <h3>Masukkan Username</h3>
    <input id="username-input" type="text" placeholder="misal: salimsantoso" />
    <br />
    <button onclick="setUsername()">Lanjutkan</button>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDONemryws3TCIcratpZOUJJ3-p82BOvxk",
    authDomain: "yuk-tadabbur.firebaseapp.com",
    projectId: "yuk-tadabbur",
    storageBucket: "yuk-tadabbur.firebasestorage.app",
    messagingSenderId: "85225211006",
    appId: "1:85225211006:web:9c30722b33ff76c4f2842f"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentUsername = null;
  let userData = { bookmarks: [], notes: {} };

  window.setUsername = function () {
    const input = document.getElementById("username-input").value.trim().toLowerCase();
    if (!/^[a-z0-9]+$/.test(input)) {
      alert("❌ Username hanya huruf kecil tanpa spasi.");
      return;
    }
    currentUsername = input;
    localStorage.setItem("quran-username", currentUsername);
    document.getElementById("username-overlay").style.display = "none";
    console.log("✅ Username disimpan:", currentUsername);

    // Coba ambil data pengguna jika ada
    db.ref("users/" + currentUsername).once("value").then(snapshot => {
      const data = snapshot.val();
      if (data) {
        userData = data;
        console.log("✅ Data user ditemukan di Firebase:", userData);
      } else {
        console.log("ℹ️ Belum ada data user di Firebase.");
      }
    });
  };

  window.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem("quran-username");
    if (saved) {
      currentUsername = saved;
      document.getElementById("username-overlay").style.display = "none";
      db.ref("users/" + currentUsername).once("value").then(snapshot => {
        const data = snapshot.val();
        if (data) {
          userData = data;
          console.log("✅ Auto-login, data user ditemukan:", userData);
        }
      });
    }
  });
</script>
</body>
</html>
