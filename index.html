<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Audio Player</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    .audio-wrapper {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Quran Audio Player</h1>

  <label for="qari-select">Pilih Qari:</label>
  <select id="qari-select"></select>

  <div id="audio-player-container"></div>

  <script>
    const surah = 1;  // contoh: Al-Fatihah
    const ayat = 1;   // contoh: ayat pertama

    const qaris = [
      { name: "Minshawy (Google Drive)", id: "Minshawy_Murattal_128kbps" },
      { name: "Al-Husary", id: "Husary_64kbps" },
      { name: "Misyari Alafasy", id: "Alafasy_64kbps" }
    ];

    const select = document.getElementById("qari-select");
    qaris.forEach(q => {
      const option = document.createElement("option");
      option.value = q.id;
      option.textContent = q.name;
      select.appendChild(option);
    });

    select.onchange = () => {
      const qariId = select.value;
      playAudioForAyah(qariId);
    };

    async function playAudioForAyah(qariId) {
      const surahStr = String(surah).padStart(3, '0');
      const ayahStr = String(ayat).padStart(3, '0');
      const key = `${surahStr}${ayahStr}`;
      const container = document.getElementById("audio-player-container");
      container.innerHTML = '';

      const audioWrapper = document.createElement("div");
      audioWrapper.className = "audio-wrapper";
      const audio = document.createElement("audio");
      audio.controls = true;

      try {
        if (qariId === "Minshawy_Murattal_128kbps") {
          const res = await fetch("https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/audio_map.json");
          const map = await res.json();
          const fileId = map[key];
          if (!fileId) throw new Error("Audio tidak tersedia");
          const blobRes = await fetch(`https://drive.google.com/uc?export=download&id=${fileId}`);
          if (!blobRes.ok) throw new Error("Gagal fetch Google Drive");
          const blob = await blobRes.blob();
          audio.src = URL.createObjectURL(blob);
        } else {
          audio.src = `https://quran.ksu.edu.sa/ayat/mp3/${qariId}/${surahStr}${ayahStr}.mp3`;
        }
        container.appendChild(audio);
      } catch (e) {
        alert("Gagal memuat audio.");
        console.error(e);
      }
    }

    // Otomatis putar saat pertama kali
    window.onload = () => {
      playAudioForAyah(select.value);
    }
  </script>
</body>
</html>
