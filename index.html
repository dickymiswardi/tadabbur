<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al-Qur'an Digital PWA</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: 'Madina', sans-serif; }
  </style>
</head>
<body>
  <div id="result">Memuat data...</div>

  <script src="https://unpkg.com/idb@7/build/iife/index-min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log("✅ Service Worker registered"))
        .catch(err => console.error("❌ Service Worker failed", err));
    }

    async function getFile(name, url) {
      const db = await idb.openDB('quran-db', 1, {
        upgrade(db) {
          if (!db.objectStoreNames.contains('files')) {
            db.createObjectStore('files');
          }
        }
      });

      let data = await db.get('files', name);
      if (data) {
        console.log(`✅ Ambil dari cache: ${name}`);
        return data;
      }

      try {
        const res = await fetch(url);
        const text = await res.text();
        await db.put('files', text, name);
        console.log(`✅ Ambil online & cache: ${name}`);
        return text;
      } catch (err) {
        console.error(`❌ Gagal fetch: ${url}`, err);
        throw err;
      }
    }

    async function loadData() {
      try {
        const [quranJson, indonesianXml, quranXml, terjemahXml, jalalaynXml] = await Promise.all([
          getFile("quran.json", "quran.json"),
          getFile("indonesian_complex_v1.0.xml", "indonesian_complex_v1.0.xml"),
          getFile("quran.xml", "quran.xml"),
          getFile("TerjemahID.xml", "TerjemahID.xml"),
          getFile("id.jalalayn.xml", "id.jalalayn.xml")
        ]);

        // Contoh: tampilkan surah dan ayat dari query string
        const params = new URLSearchParams(window.location.search);
        const surah = params.get('surah') || '1';
        const ayat = params.get('ayat') || '1';

        const quranData = JSON.parse(quranJson);
        const surahData = quranData.surah[surah];
        const ayatText = surahData?.ayat[ayat] || "Ayat tidak ditemukan";

        document.getElementById("result").textContent = `${ayatText}`;
      } catch (err) {
        document.getElementById("result").textContent = "❌ Gagal memuat data.";
      }
    }

    loadData();
  </script>

  <style>
    @font-face {
      font-family: 'Madina';
      src: url('madina.woff2') format('woff2');
    }
  </style>
</body>
</html>
