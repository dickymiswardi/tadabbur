<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Terjemah Per Kata Interaktif</title>
  <style>
    body {
      background: #fefcf8;
      text-align: center;
      font-family: sans-serif;
      direction: rtl;
      padding: 2em;
    }

    #ayah-visual {
      font-family: 'QCF_P002', serif;
      font-size: 3em;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4em;
      cursor: pointer;
    }

    .word-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease-in-out;
    }

    .arabic-word {
      font-family: 'QCF_P002', serif;
      font-size: 1.4em;
      line-height: 1.2;
    }

    .translation-word {
      font-size: 0.6em;
      color: #555;
      display: none;
    }

    #ayah-visual.active .translation-word {
      display: block;
    }

    #ayah-visual.active .arabic-word {
      font-size: 1em;
    }

    @font-face {
      font-family: 'QCF_P002';
      src: url('https://dickymiswardi.github.io/tadabbur/QCF_P002.TTF') format('truetype');
    }
  </style>
</head>
<body>

  <h1>النص القرآني مع الترجمة الفورية</h1>

  <div id="ayah-visual">جارٍ التحميل...</div>

  <script>
    const surah = 2;
    const ayah = 2;

    fetch(`https://api.quran.com/api/v4/verses/by_key/${surah}:${ayah}?words=true&translations=33`)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("ayah-visual");
        container.innerHTML = '';
        container.classList.remove('active');

        const words = data.verse.words;

        words.forEach(word => {
          const wrapper = document.createElement('div');
          wrapper.className = 'word-wrapper';

          const arabic = document.createElement('div');
          arabic.className = 'arabic-word';
          arabic.innerText = word.code_v1 || word.text;

          const trans = document.createElement('div');
          trans.className = 'translation-word';
          trans.innerText = word.translation?.text || '';

          wrapper.appendChild(arabic);
          wrapper.appendChild(trans);
          container.appendChild(wrapper);
        });

        // Tambahkan nomor ayat di akhir
        const number = document.createElement('div');
        number.innerText = `﴿${ayah}﴾`;
        number.className = 'arabic-word';
        container.appendChild(number);

        // Klik untuk toggle
        container.addEventListener('click', () => {
          container.classList.toggle('active');
        });
      });
  </script>

</body>
</html>
