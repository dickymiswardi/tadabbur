<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al-Qur'an Digital</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; max-width: 700px; margin: auto; }
    select, button { padding: 0.4rem; font-size: 1rem; margin: 0.3rem; }
    #loader { background: #f1f1f1; padding: 1rem; border-radius: 6px; display: none; }
    #ayat-box { margin-top: 2rem; }
    #arab { font-size: 2rem; text-align: right; line-height: 2; }
    #terjemah { font-size: 1.1rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div id="pilihan-container">
    <select id="surah"></select>
    <select id="ayat"></select>
    <button id="prevBtn">◀ Prev</button>
    <button id="nextBtn">Next ▶</button>
  </div>

  <div id="loader">
    <p id="loader-status">📥 Mengunduh data...</p>
    <progress id="loader-bar" value="0" max="100" style="width: 100%; height: 20px;"></progress>
  </div>

  <div id="ayat-box">
    <h2 id="arab">(Memuat ayat...)</h2>
    <p id="terjemah">(Memuat terjemah...)</p>
  </div>

  <script>
    const surahSelect = document.getElementById("surah");
    const ayatSelect = document.getElementById("ayat");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const surahData = [
      ["Al-Fatihah", 7], ["Al-Baqarah", 286], ["Ali 'Imran", 200], // dst sampai 114
    ];

    function populateSurahs() {
      surahData.forEach(([name], i) => {
        surahSelect.appendChild(new Option(`${i + 1}. ${name}`, i + 1));
      });
    }

    function populateAyat(surahIndex, selectedAyat = null) {
      ayatSelect.innerHTML = '<option value="">-- Pilih Ayat --</option>';
      if (!surahIndex) return;
      const totalAyat = surahData[surahIndex - 1][1];
      for (let i = 1; i <= totalAyat; i++) {
        ayatSelect.appendChild(new Option(`Ayat ${i}`, i));
      }
      if (selectedAyat) ayatSelect.value = selectedAyat;
    }

    surahSelect.onchange = () => {
      const surah = parseInt(surahSelect.value);
      localStorage.setItem("lastSurah", surah);
      populateAyat(surah);
    };

    ayatSelect.onchange = () => {
      const surah = parseInt(surahSelect.value);
      const ayat = parseInt(ayatSelect.value);
      if (surah && ayat) {
        localStorage.setItem("lastSurah", surah);
        localStorage.setItem("lastAyat", ayat);
        renderAyat(surah, ayat);
      }
    };

    prevBtn.onclick = () => {
      const surah = parseInt(localStorage.getItem("lastSurah"));
      const ayat = parseInt(localStorage.getItem("lastAyat"));
      const prev = getPrevAyah(surah, ayat);
      if (prev) renderAyat(prev.surah, prev.ayat);
    };

    nextBtn.onclick = () => {
      const surah = parseInt(localStorage.getItem("lastSurah"));
      const ayat = parseInt(localStorage.getItem("lastAyat"));
      const next = getNextAyah(surah, ayat);
      if (next) renderAyat(next.surah, next.ayat);
    };

    function getPrevAyah(surah, ayat) {
      if (ayat > 1) return { surah, ayat: ayat - 1 };
      if (surah > 1) {
        const total = surahData[surah - 2][1];
        return { surah: surah - 1, ayat: total };
      }
      return null;
    }

    function getNextAyah(surah, ayat) {
      const total = surahData[surah - 1][1];
      if (ayat < total) return { surah, ayat: ayat + 1 };
      if (surah < 114) return { surah: surah + 1, ayat: 1 };
      return null;
    }

    async function syncOfflineFilesWithProgress() {
      const files = [
        { url: "https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/quran.json", key: "quran.json" },
        { url: "https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/indonesian_complex_v1.0.xml", key: "indonesian_complex_v1.0.xml" },
        { url: "https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/quran.xml", key: "quran.xml" },
        { url: "https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/TerjemahID.xml", key: "TerjemahID.xml" },
      ];

      const loader = document.getElementById("loader");
      const loaderBar = document.getElementById("loader-bar");
      const loaderStatus = document.getElementById("loader-status");

      loader.style.display = "block";
      for (let i = 0; i < files.length; i++) {
        const { url, key } = files[i];
        loaderStatus.textContent = `📥 Mengunduh ${key} (${i + 1} dari ${files.length})...`;
        const res = await fetch(url);
        const text = await res.text();
        localStorage.setItem(key, text);
        loaderBar.value = ((i + 1) / files.length) * 100;
      }

      loaderStatus.textContent = "✅ Semua data berhasil diunduh!";
      setTimeout(() => loader.style.display = "none", 1500);
    }

    let xmlDoc;
    function getTerjemah(surah, ayat) {
      const el = xmlDoc.querySelector(`ayah[sura='${surah}'][aya='${ayat}']`);
      return el?.textContent || "(Terjemah tidak ditemukan)";
    }

    function renderAyat(surah, ayat) {
      try {
        localStorage.setItem("lastSurah", surah);
        localStorage.setItem("lastAyat", ayat);

        const quranData = JSON.parse(localStorage.getItem("quran.json"));
        const ayatArab = quranData.find(x => x.surah_number === surah && x.verse_number === ayat)?.content || "(Teks Arab tidak ditemukan)";

        const terjemah = getTerjemah(surah, ayat);

        document.getElementById("arab").textContent = ayatArab;
        document.getElementById("terjemah").textContent = terjemah;

        surahSelect.value = surah;
        populateAyat(surah, ayat);
      } catch (err) {
        console.error("renderAyat gagal:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (!localStorage.getItem("quran.json")) {
        await syncOfflineFilesWithProgress();
      }

      const xmlText = localStorage.getItem("indonesian_complex_v1.0.xml");
      xmlDoc = new DOMParser().parseFromString(xmlText, "text/xml");

      populateSurahs();

      const surah = parseInt(localStorage.getItem("lastSurah") || "1");
      const ayat = parseInt(localStorage.getItem("lastAyat") || "1");
      populateAyat(surah, ayat);
      renderAyat(surah, ayat);
    });
  </script>
</body>
</html>
