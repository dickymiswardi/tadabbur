
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushaf Halaman Responsif</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fefcf8;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
    }

    .mushaf-page {
      max-width: 700px;
      aspect-ratio: 2 / 3;
      padding: 1em;
      margin: 1em auto;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      box-sizing: border-box;
      display: grid;
      grid-template-rows: repeat(15, 1fr);
      direction: rtl;
    }

    .line {
      text-align: justify;
      font-size: 1.9em;
      line-height: 1.5;
      font-family: 'QCF_P002';
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
    }

    .word {
      display: inline-block;
      position: relative;
      cursor: pointer;
      margin: 0 0.1em;
    }

    .word:hover {
      background-color: #f7eacb;
      border-radius: 6px;
    }

    .translation {
      position: absolute;
      bottom: -2.4em;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.45em;
      padding: 0.3em 0.6em;
      white-space: nowrap;
      display: none;
      z-index: 10;
    }

    .word.active .translation {
      display: block;
    }

    @font-face {
      font-family: 'QCF_P002';
      src: url('https://dickymiswardi.github.io/tadabbur/QCF_P002.TTF') format('truetype');
      font-display: swap;
    }
  </style>
</head>
<body>

<div class="mushaf-page" id="page"></div>

<script>
const surah = 2;
const startAyah = 1;
const endAyah = 5;
let timeoutId = null;
let activeWord = null;
let originalUnicode = "";

const page = document.getElementById("page");

fetch("https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/quran-uthmani.xml")
  .then(res => res.text())
  .then(str => (new DOMParser()).parseFromString(str, "text/xml"))
  .then(xml => {
    for (let i = startAyah; i <= endAyah; i++) {
      const aya = xml.querySelector(`sura[index='${surah}'] > aya[index='${i}']`);
      if (aya) {
        originalUnicode += aya.getAttribute("text") + ` (${i}) `;
      }
    }
  });

document.fonts.ready.then(() => {
  const fetches = [];
  for (let i = startAyah; i <= endAyah; i++) {
    fetches.push(fetch(`https://api.quran.com/api/v4/verses/by_key/${surah}:${i}?words=true&language=id&translations=33`).then(r => r.json()));
  }

  Promise.all(fetches).then(results => {
    results.forEach(data => {
      const line = document.createElement("div");
      line.className = "line";
      data.verse.words.forEach(word => {
        const span = document.createElement("span");
        span.className = "word";
        span.textContent = word.code_v1 || word.text;

        const trans = document.createElement("div");
        trans.className = "translation";
        trans.textContent = word.translation?.text || "-";
        span.appendChild(trans);

        span.addEventListener("click", () => {
          if (span === activeWord) {
            span.classList.remove("active");
            clearTimeout(timeoutId);
            activeWord = null;
          } else {
            document.querySelectorAll(".word").forEach(w => w.classList.remove("active"));
            span.classList.add("active");
            activeWord = span;
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
              span.classList.remove("active");
              activeWord = null;
            }, 7000);
          }
        });

        line.appendChild(span);
        line.appendChild(document.createTextNode(" "));
      });
      page.appendChild(line);
    });
  });
});

document.addEventListener("copy", function (e) {
  if (originalUnicode) {
    e.preventDefault();
    e.clipboardData.setData("text/plain", originalUnicode.trim());
  }
});
</script>

</body>
</html>
