<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Terjemah Per Kata Interaktif</title>
  <style>
    body {
      background: #fefdf8;
      text-align: center;
      padding: 2em;
      direction: rtl;
      font-family: sans-serif;
    }

    #ayah-container {
      font-family: 'QCF_P002', serif;
      font-size: 3em;
      line-height: 1.8;
      user-select: text;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4em;
    }

    .word {
      position: relative;
      cursor: pointer;
      display: inline-block;
    }

    .word:hover {
      background-color: #f7eacb;
      border-radius: 8px;
    }

    .translation {
      position: absolute;
      bottom: -2.2em;
      font-family: sans-serif;
      font-size: 0.5em;
      color: #444;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.3em 0.6em;
      white-space: nowrap;
      display: none;
      z-index: 10;
    }

    .active .translation {
      display: block;
    }

    @font-face {
      font-family: 'QCF_P002';
      src: url('https://dickymiswardi.github.io/tadabbur/QCF_P002.TTF') format('truetype');
      font-display: swap;
    }
  </style>
</head>
<body>

  <h2>Klik Kata untuk Terjemah</h2>
  <div id="ayah-container">جارٍ التحميل...</div>

  <script>
    const surah = 2;
    const ayah = 2;

    fetch(`https://api.quran.com/api/v4/verses/by_key/${surah}:${ayah}?words=true&translations=33`)
      .then(res => res.json())
      .then(data => {
        const words = data.verse.words;

        const container = document.getElementById("ayah-container");
        container.innerHTML = ""; // Clear loading text

        words.forEach(word => {
          const span = document.createElement("span");
          span.className = "word";
          span.innerText = word.code_v1 || word.text;

          const trans = document.createElement("div");
          trans.className = "translation";
          trans.innerText = word.translation?.text || "";

          span.appendChild(trans);
          span.addEventListener("click", () => {
            span.classList.toggle("active");
          });

          container.appendChild(span);
        });
      });
  </script>

</body>
</html>
