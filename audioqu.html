<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pencarian Al-Qur'an</title>
  <style>
    body { font-family: sans-serif; padding: 2em; max-width: 600px; margin: auto; }
    input, button { padding: 0.5em; margin-top: 1em; width: 100%; }
    .result { margin-top: 1.5em; border-top: 1px solid #ccc; padding-top: 1em; }
    .result div { margin-bottom: 1em; }
    a { text-decoration: none; color: darkblue; }
  </style>
</head>
<body>
  <h2>🔎 Pencarian Kata dalam Al-Qur'an</h2>

  <input id="search-input" placeholder="Masukkan kata, contoh: الرحمن" />
  <button onclick="searchQuran()">Cari</button>

  <div id="results" class="result"></div>

  <script>
    async function searchQuran() {
      const query = document.getElementById("search-input").value.trim();
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "⏳ Mencari...";

      try {
        const response = await fetch(`https://api.quran.com/v4/search?q=${encodeURIComponent(query)}&language=id&size=50&source=translation`);
        const data = await response.json();

        if (!data.results.length) {
          resultsDiv.innerHTML = "❌ Tidak ditemukan.";
          return;
        }

        resultsDiv.innerHTML = "";
        data.results.forEach(item => {
          const [surah, ayat] = item.verse_key.split(":");
          const tautan = `https://tadabbur.netlify.app/?surah=${surah}&ayat=${ayat}`;
          const div = document.createElement("div");
          div.innerHTML = `
            <strong>QS ${item.verse_key}</strong><br>
            <span style="font-size: 1.2em;">${item.text}</span><br>
            <em>${item.translations?.[0]?.text || ''}</em><br>
            <a href="${tautan}" target="_blank">➡️ Buka ayat di situsmu</a>
          `;
          resultsDiv.appendChild(div);
        });

      } catch (err) {
        console.error(err);
        resultsDiv.innerHTML = "❌ Gagal mengambil data.";
      }
    }
  </script>
</body>
</html>
