name: Sync User Data

on:
  issues:
    types: [opened]

jobs:
  process-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Extract JSON from issue body
        run: |
          echo "${{ github.event.issue.body }}" > issue.txt
          sed -n '/```json/,/```/p' issue.txt | sed '1d;$d' > user.json

      - name: Commit static user file (no username logic)
        run: |
          mkdir -p users
          cp user.json users/last.json
          git config user.name github-actions
          git config user.email actions@github.com
          git add users/last.json
          git commit -m "Update last.json user data"
          git push
