name: Sync User Data

on:
  issues:
    types: [opened]

jobs:
  process-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Extract JSON from issue body
        run: |
          echo "${{ github.event.issue.body }}" > issue.txt
          sed -n '/```json/,/```/p' issue.txt | sed '1d;$d' > user.json

      - name: Get username
        id: get_user
        run: |
          echo "::set-output name=username::$(jq -r .username user.json)"

      - name: Commit user data
        run: |
          mkdir -p users
          cp user.json users/${{ steps.get_user.outputs.username }}.json
          git config user.name github-actions
          git config user.email actions@github.com
          git add users/
          git commit -m "Update user data for ${{ steps.get_user.outputs.username }}"
          git push

