name: Sync User Data (Strong)

on:
  issues:
    types: [opened]

jobs:
  process-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Write issue body as JSON
        run: |
          echo '${{ github.event.issue.body }}' > users/last.json
          cat users/last.json

      - name: Commit last.json safely
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add users/last.json
          git commit -m "Save last.json from issue"
          git push
