<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Ayat Al-Qur’an Rapi + Terjemah Klik</title>
  <style>
    body {
      background: #fefcf8;
      text-align: center;
      padding: 2em;
      direction: rtl;
      font-family: sans-serif;
    }

    #ayah-container {
      font-family: 'QCF_P002', serif;
      font-size: 3em;
      line-height: 2;
      user-select: text;
      display: inline-block;
    }

    .word {
      position: relative;
      cursor: pointer;
      display: inline-block;
      margin: 0 0.1em;
    }

    .word:hover {
      background-color: #f7eacb;
      border-radius: 6px;
    }

    .translation {
      position: absolute;
      bottom: -2.4em;
      font-family: sans-serif;
      font-size: 0.5em;
      color: #444;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.3em 0.6em;
      white-space: nowrap;
      display: none;
      z-index: 10;
    }

    .active .translation {
      display: block;
    }

    @font-face {
      font-family: 'QCF_P002';
      src: url('https://dickymiswardi.github.io/tadabbur/QCF_P002.TTF') format('truetype');
      font-display: swap;
    }
  </style>
</head>
<body>

  <h2>Klik Kata untuk Terjemah (Indonesia)</h2>
  <div id="ayah-container">جارٍ التحميل...</div>

  <script>
    const surah = 2;
    const ayah = 2;
    let timeoutId = null;
    let activeWord = null;

    fetch(`https://api.quran.com/api/v4/verses/by_key/${surah}:${ayah}?words=true&language=id&translations=33`)
      .then(res => res.json())
      .then(data => {
        const words = data.verse.words;
        const container = document.getElementById("ayah-container");
        container.innerHTML = "";

        words.forEach(word => {
          const span = document.createElement("span");
          span.className = "word";
          span.innerText = word.code_v1 || word.text;

          const trans = document.createElement("div");
          trans.className = "translation";
          trans.innerText = word.translation?.text || "-";

          span.appendChild(trans);

          span.addEventListener("click", () => {
            if (span === activeWord) {
              span.classList.remove("active");
              clearTimeout(timeoutId);
              activeWord = null;
              return;
            }

            document.querySelectorAll(".word").forEach(w => w.classList.remove("active"));
            span.classList.add("active");
            activeWord = span;

            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
              span.classList.remove("active");
              activeWord = null;
            }, 7000);
          });

          container.appendChild(span);
        });
      })
      .catch(err => {
        document.getElementById("ayah-container").textContent = "❌ Gagal memuat data.";
        console.error(err);
      });
  </script>

</body>
</html>
