
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushaf Halaman</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fefcf8;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
    }

    .mushaf-page {
      width: 100%;
      max-width: 700px;
      aspect-ratio: 2 / 3;
      background: linear-gradient(to bottom, #fffdf7, #fefcf8);
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: grid;
      grid-template-rows: 1.2fr repeat(13, 1fr) 0.8fr 0.5fr;
      padding: 1em;
      box-sizing: border-box;
    }

    .surah-title {
      text-align: center;
      font-size: 1.4em;
      font-weight: bold;
      padding-top: 0.5em;
      font-family: serif;
    }

    .line {
      text-align: justify;
      font-size: 2em;
      line-height: 1.5;
      font-family: 'QCF_P003', serif;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .word {
      display: inline-block;
      position: relative;
      cursor: pointer;
      margin: 0 0.1em;
    }

    .translation {
      position: absolute;
      bottom: -2.4em;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.45em;
      padding: 0.3em 0.6em;
      white-space: nowrap;
      display: none;
      z-index: 10;
    }

    .word.active .translation {
      display: block;
    }

    .page-number {
      text-align: center;
      font-size: 0.9em;
      color: #555;
    }

    @font-face {
      font-family: 'QCF_P003';
      src: url('https://dickymiswardi.github.io/tadabbur/QCF_P003.TTF') format('truetype');
      font-display: swap;
    }
  </style>
</head>
<body>

  <div class="mushaf-page" id="mushaf">
    <div class="surah-title" id="surah-title">سورة آل عمران</div>
    
    <!-- 13 baris ayat akan dimasukkan oleh JS di sini -->
    
    <div class="line" id="last-line"></div>
    <div class="page-number">50</div>
  </div>

<script>
const surah = 3;
const startAyah = 1;
const endAyah = 9;
let originalUnicode = "";
let activeWord = null;
let timeoutId = null;

const mushaf = document.getElementById("mushaf");
const surahTitle = document.getElementById("surah-title");

fetch("https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/quran-uthmani.xml")
  .then(res => res.text())
  .then(str => (new DOMParser()).parseFromString(str, "text/xml"))
  .then(xml => {
    for (let i = startAyah; i <= endAyah; i++) {
      const aya = xml.querySelector(`sura[index='${surah}'] > aya[index='${i}']`);
      if (aya) {
        originalUnicode += aya.getAttribute("text") + ` (${i}) `;
      }
    }
  });

document.fonts.ready.then(() => {
  const fetches = [];
  for (let i = startAyah; i <= endAyah; i++) {
    fetches.push(fetch(`https://api.quran.com/api/v4/verses/by_key/${surah}:${i}?words=true&language=id&translations=33`).then(r => r.json()));
  }

  Promise.all(fetches).then(results => {
    results.forEach((data, index) => {
      const line = document.createElement("div");
      line.className = "line";
      data.verse.words.forEach(word => {
        const span = document.createElement("span");
        span.className = "word";
        span.textContent = word.code_v1 || word.text;

        const trans = document.createElement("div");
        trans.className = "translation";
        trans.textContent = word.translation?.text || "-";
        span.appendChild(trans);

        span.addEventListener("click", () => {
          if (span === activeWord) {
            span.classList.remove("active");
            clearTimeout(timeoutId);
            activeWord = null;
          } else {
            document.querySelectorAll(".word").forEach(w => w.classList.remove("active"));
            span.classList.add("active");
            activeWord = span;
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
              span.classList.remove("active");
              activeWord = null;
            }, 7000);
          }
        });

        line.appendChild(span);
        line.appendChild(document.createTextNode(" "));
      });
      mushaf.insertBefore(line, document.getElementById("last-line"));
    });
  });
});

document.addEventListener("copy", function (e) {
  if (originalUnicode) {
    e.preventDefault();
    e.clipboardData.setData("text/plain", originalUnicode.trim());
  }
});
</script>

</body>
</html>
