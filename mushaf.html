<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Quran Per Kata</title>
  <style>
    @font-face {
      font-family: 'QuranFont';
      src: url('https://cdn.jsdelivr.net/gh/dickymiswardi/tadabbur/fonts/QCF_P002.TTF') format('truetype');
      font-display: swap;
    }

    body {
      font-family: 'QuranFont', 'Amiri', 'Scheherazade', 'Traditional Arabic', serif;
      font-size: 36px;
      direction: rtl;
      text-align: right;
      padding: 40px;
      background: #fcfbf8;
    }

    .word {
      display: inline-block;
      margin: 6px;
      padding: 6px 10px;
      border: 1px solid #aaa;
      border-radius: 12px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h2>📘 Kata-kata dari Al-Qur'an</h2>
  <div id="words">⏳ Memuat...</div>

  <script>
    // Contoh: ambil 1 ayat — bisa diganti ke ayat manapun
    const surah = 2;
    const ayah = 10;

    const url = `https://api.quran.com/api/v4/verses/by_key/${surah}:${ayah}?words=true&fields=words`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("words");
        container.innerHTML = "";
        const words = data.verse.words;

        words.forEach(word => {
          if (word.char_type_name === "word") {
            const span = document.createElement("span");
            span.className = "word";
            span.textContent = word.code_v1 || word.text;
            container.appendChild(span);
          }
        });
      })
      .catch(err => {
        document.getElementById("words").innerHTML = "⚠️ Gagal memuat kata.";
        console.error(err);
      });
  </script>
</body>
</html>
