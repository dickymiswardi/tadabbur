<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Halaman 2 Al-Qur'an</title>

  <!-- Ganti URL ini dengan link font kamu -->
  <style>
    @font-face {
      font-family: 'QuranUthmani';
      src: url('https://github.com/dickymiswardi/tadabbur/raw/refs/heads/main/QCF_P002.TTF') format('opentype');
      font-display: swap;
    }

    body {
      font-family: 'QuranUthmani', 'Amiri', 'Scheherazade', serif;
      font-size: 36px;
      direction: rtl;
      text-align: right;
      padding: 40px;
      background: #fdfcf9;
    }

    .ayah {
      margin-bottom: 20px;
    }

    .word {
      display: inline-block;
      margin: 4px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    .verse-key {
      font-size: 16px;
      color: gray;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>📖 Al-Qur'an - Halaman 2</h2>
  <div id="page"></div>

  <script>
    const page = 2;
    const url = `https://api.quran.com/api/v4/quran/verses?page_number=${page}&words=true&fields=words`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("page");
        const verses = data.verses;

        verses.forEach(verse => {
          const ayahDiv = document.createElement("div");
          ayahDiv.className = "ayah";

          verse.words.forEach(word => {
            if (word.char_type_name === "word") {
              const span = document.createElement("span");
              span.className = "word";
              span.textContent = word.code_v1 || word.text;
              ayahDiv.appendChild(span);
            }
          });

          const key = document.createElement("div");
          key.className = "verse-key";
          key.textContent = `(${verse.verse_key})`;
          ayahDiv.appendChild(key);

          container.appendChild(ayahDiv);
        });
      })
      .catch(err => {
        document.getElementById("page").textContent = "Gagal memuat halaman.";
        console.error(err);
      });
  </script>
</body>
</html>
