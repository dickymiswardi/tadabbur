<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Surah Al-Baqarah 1–5 - Menyambung</title>
  <style>
    body {
      background: #fefcf8;
      text-align: right;
      padding: 2em;
      direction: rtl;
      font-family: sans-serif;
      line-height: 2.8;
      font-size: 2.2em;
    }

    .quran-text {
      font-family: 'QCF_P002', serif;
      display: inline;
      user-select: text;
    }

    .word {
      position: relative;
      display: inline-block;
      cursor: pointer;
      margin: 0 0.1em;
    }

    .word:hover {
      background-color: #f3f3f3;
      border-radius: 4px;
    }

    .translation {
      position: absolute;
      bottom: -2.6em;
      font-size: 0.45em;
      background-color: #fff;
      padding: 0.2em 0.6em;
      border: 1px solid #ccc;
      border-radius: 4px;
      white-space: nowrap;
      color: #444;
      display: none;
      font-family: sans-serif;
      z-index: 5;
    }

    .word.active .translation {
      display: block;
    }

    .ayah-marker {
      font-size: 0.5em;
      color: #666;
      margin: 0 0.2em;
    }

    @font-face {
      font-family: 'QCF_P002';
      src: url('https://dickymiswardi.github.io/tadabbur/QCF_P002.TTF') format('truetype');
      font-display: swap;
    }
  </style>
</head>
<body>

  <h2 style="text-align: center;">سورة البقرة ١–٥</h2>
  <div class="quran-text" id="quran-text">جارٍ التحميل...</div>

  <script>
    const surah = 2;
    const from = 1;
    const to = 5;
    const container = document.getElementById("quran-text");
    container.innerHTML = "";

    let activeWord = null;
    let timeoutId = null;

    function createWordEl(word) {
      const span = document.createElement("span");
      span.className = "word";
      span.innerText = word.code_v1 || word.text;

      const trans = document.createElement("div");
      trans.className = "translation";
      trans.innerText = word.translation?.text || '-';
      span.appendChild(trans);

      span.addEventListener("click", () => {
        if (activeWord === span) {
          span.classList.remove("active");
          activeWord = null;
          clearTimeout(timeoutId);
          return;
        }

        document.querySelectorAll(".word").forEach(w => w.classList.remove("active"));
        span.classList.add("active");
        activeWord = span;

        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
          span.classList.remove("active");
          activeWord = null;
        }, 7000);
      });

      return span;
    }

    async function loadVerses() {
      for (let ayah = from; ayah <= to; ayah++) {
        try {
          const res = await fetch(`https://api.quran.com/api/v4/verses/by_key/${surah}:${ayah}?words=true&language=id&translations=33`);
          const data = await res.json();

          data.verse.words.forEach(word => {
            const wordEl = createWordEl(word);
            container.appendChild(wordEl);
          });

          const marker = document.createElement("span");
          marker.className = "ayah-marker";
          marker.innerText = `﴿${ayah}﴾`;
          container.appendChild(marker);

        } catch (err) {
          container.innerHTML += `<p>❌ Gagal memuat ayat ${ayah}</p>`;
        }
      }
    }

    loadVerses();
  </script>

</body>
</html>
