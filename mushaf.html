<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Al-Qur'an - Halaman 2 📖</title>

  <!-- Load font Quran dari jsDelivr (ganti sesuai font kamu) -->
  <style>
    @font-face {
      font-family: 'QuranFont';
      src: url('https://cdn.jsdelivr.net/gh/dickymiswardi/tadabbur@raw/refs/heads/main/QCF_P002.TTF') format('truetype');
      font-display: swap;
    }

    body {
      font-family: 'QuranFont', 'Amiri', 'Scheherazade', 'Traditional Arabic', serif;
      font-size: 36px;
      direction: rtl;
      text-align: right;
      padding: 40px;
      background: #fefdfb;
      color: #111;
    }

    .ayah {
      margin-bottom: 30px;
    }

    .word {
      display: inline-block;
      margin: 4px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    .verse-key {
      font-size: 18px;
      color: gray;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h2>📖 Al-Qur'an - Halaman 2</h2>
  <div id="page">⏳ Memuat ayat...</div>

  <script>
    const page = 2;
    const url = `https://api.quran.com/api/v4/quran/verses?page_number=${page}&words=true&fields=words`;

    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error("Gagal ambil data dari API");
        return res.json();
      })
      .then(data => {
        const container = document.getElementById("page");
        container.innerHTML = ""; // kosongkan loader
        const verses = data.verses;

        verses.forEach(verse => {
          const ayahDiv = document.createElement("div");
          ayahDiv.className = "ayah";

          verse.words.forEach(word => {
            if (word.char_type_name === "word") {
              const span = document.createElement("span");
              span.className = "word";
              span.textContent = word.code_v1 || word.text;
              ayahDiv.appendChild(span);
            }
          });

          const key = document.createElement("div");
          key.className = "verse-key";
          key.textContent = `(${verse.verse_key})`;
          ayahDiv.appendChild(key);

          container.appendChild(ayahDiv);
        });
      })
      .catch(err => {
        document.getElementById("page").innerHTML = "<b style='color:red;'>⚠️ Gagal memuat halaman</b>";
        console.error("API Error:", err);
      });
  </script>
</body>
</html>
