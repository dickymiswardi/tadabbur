<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Al-Qur'an Per Kata Interaktif</title>
  <style>
    body {
      background: #fefcf8;
      font-family: sans-serif;
      text-align: center;
      padding: 2em;
      direction: rtl;
    }

    #ayah-visual {
      font-family: 'QCF_P002', serif;
      font-size: 3em;
      user-select: none;
      cursor: pointer;
      line-height: 1.8;
      display: inline-block;
    }

    .word {
      display: inline-block;
      margin: 0 0.2em;
    }

    .translated {
      font-family: sans-serif;
      font-size: 1em;
      color: #444;
      display: block;
      text-align: center;
      margin-top: 0.2em;
    }

    @font-face {
      font-family: 'QCF_P002';
      src: url('https://dickymiswardi.github.io/tadabbur/QCF_P002.TTF') format('truetype');
      font-display: swap;
    }
  </style>
</head>
<body>

  <h1>القرآن الكريم - ترجمة فورية للكلمة</h1>

  <div id="ayah-visual"></div>

  <script>
    const surah = 2;
    const ayah = 2;

    fetch(`https://api.quran.com/api/v4/verses/by_key/${surah}:${ayah}?words=true&translations=33`)
      .then(res => res.json())
      .then(data => {
        const words = data.verse.words;

        const container = document.getElementById("ayah-visual");
        container.innerHTML = ''; // kosongkan

        words.forEach(word => {
          const span = document.createElement('span');
          span.className = 'word';
          span.setAttribute('data-glyph', word.code_v1 || word.text);
          span.setAttribute('data-translate', word.translation?.text || '');
          span.setAttribute('data-state', 'glyph');
          span.innerText = word.code_v1 || word.text;
          container.appendChild(span);
        });

        // Tambah nomor ayat di akhir
        const ayahNum = document.createElement('span');
        ayahNum.innerText = ` ﴿${ayah}﴾`;
        container.appendChild(ayahNum);

        // Toggle saat diklik
        container.addEventListener('click', () => {
          const spans = container.querySelectorAll('.word');
          spans.forEach(span => {
            const state = span.getAttribute('data-state');
            if (state === 'glyph') {
              span.innerText = span.getAttribute('data-translate');
              span.setAttribute('data-state', 'translate');
              span.style.fontFamily = 'sans-serif';
              span.style.fontSize = '1.2em';
            } else {
              span.innerText = span.getAttribute('data-glyph');
              span.setAttribute('data-state', 'glyph');
              span.style.fontFamily = 'QCF_P002';
              span.style.fontSize = '';
            }
          });
        });
      });
  </script>

</body>
</html>
