<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Qur'an Dinamis</title>
  <style>
    body {
      background: #fefcf8;
      padding: 2em;
      direction: rtl;
      font-family: sans-serif;
      text-align: center;
    }

    .page-container {
      font-size: 3em;
      line-height: 1.4;
      user-select: text;
      text-align: justify;
      margin: 2em auto;
      max-width: 1200px;
      opacity: 0;
      transition: opacity 0.3s ease;
      display: none;
    }

    .word {
      position: relative;
      cursor: pointer;
      display: inline-block;
      margin: 0 0.1em;
    }

    .word:hover {
      background-color: #f7eacb;
      border-radius: 6px;
    }

    .translation {
      position: absolute;
      bottom: -2.4em;
      font-family: sans-serif;
      font-size: 0.5em;
      color: #444;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.3em 0.6em;
      white-space: nowrap;
      display: none;
      z-index: 10;
    }

    .active .translation {
      display: block;
    }
  </style>
</head>
<body>

<h2>Al-Qur’an Dinamis Berdasarkan Halaman Mushaf</h2>
<div id="main"></div>

<script>
  const surah = 2;
  const startAyah = 2;
  const endAyah = 9;
  let originalUnicode = "";
  let timeoutId = null;
  let activeWord = null;
  const container = document.getElementById("main");

  // Fungsi muat font dinamis
  function loadQuranFont(pageNumber) {
    const fontName = `QCF_P${String(pageNumber).padStart(3, '0')}`;
    const fontURL = `https://dickymiswardi.github.io/tadabbur/${fontName}.TTF`;

    if (document.fonts.check(`1em ${fontName}`)) {
      return Promise.resolve(fontName);
    }

    const style = document.createElement("style");
    style.innerHTML = `
      @font-face {
        font-family: '${fontName}';
        src: url('${fontURL}') format('truetype');
        font-display: swap;
      }
    `;
    document.head.appendChild(style);

    return document.fonts.load(`1em '${fontName}'`).then(() => fontName);
  }

  // Ambil Unicode dari XML
  fetch("https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/quran-uthmani.xml")
    .then(res => res.text())
    .then(str => (new window.DOMParser()).parseFromString(str, "text/xml"))
    .then(xml => {
      let combined = "";
      for (let i = startAyah; i <= endAyah; i++) {
        const ayaNode = xml.querySelector(`sura[index="${surah}"] > aya[index="${i}"]`);
        if (ayaNode) {
          combined += ayaNode.getAttribute("text") + ` (${i}) `;
        }
      }
      originalUnicode = combined.trim();
    });

  // Ambil data ayat dari API Quran.com
  document.fonts.ready.then(() => {
    const promises = [];
    for (let i = startAyah; i <= endAyah; i++) {
      const url = `https://api.quran.com/api/v4/verses/by_key/${surah}:${i}?words=true&language=id&translations=33`;
      promises.push(fetch(url).then(res => res.json()));
    }

    Promise.all(promises).then(results => {
      const pageGroups = {};

      results.forEach(data => {
        const page = data.verse.v1_page;
        if (!pageGroups[page]) pageGroups[page] = [];
        pageGroups[page].push(data.verse.words);
      });

      Object.entries(pageGroups).forEach(([page, wordGroups]) => {
        loadQuranFont(page).then(fontName => {
          const pageDiv = document.createElement("div");
          pageDiv.className = "page-container";
          pageDiv.style.fontFamily = fontName;

          wordGroups.forEach(words => {
            words.forEach(word => {
              const span = document.createElement("span");
              span.className = "word";
              span.innerText = word.code_v1 || word.text;

              const trans = document.createElement("div");
              trans.className = "translation";
              trans.innerText = word.translation?.text || "-";

              span.appendChild(trans);

              span.addEventListener("click", () => {
                if (span === activeWord) {
                  span.classList.remove("active");
                  clearTimeout(timeoutId);
                  activeWord = null;
                  return;
                }

                document.querySelectorAll(".word").forEach(w => w.classList.remove("active"));
                span.classList.add("active");
                activeWord = span;

                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                  span.classList.remove("active");
                  activeWord = null;
                }, 7000);
              });

              pageDiv.appendChild(span);
            });
          });

          container.appendChild(pageDiv);
          pageDiv.style.display = "block";
          requestAnimationFrame(() => {
            pageDiv.style.opacity = "1";
          });
        });
      });
    });
  });

  // Salin teks asli (unicode) dari XML
  document.addEventListener("copy", function (e) {
    if (originalUnicode) {
      e.preventDefault();
      e.clipboardData.setData("text/plain", originalUnicode);
      console.log("Copied Unicode:", originalUnicode);
    }
  });
</script>

</body>
</html>
