<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Ayat Mushaf + Copy Unicode</title>
  <style>
    body {
      background: #fefcf8;
      font-family: sans-serif;
      text-align: center;
      padding: 2em;
      direction: rtl;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 1em;
    }

    #ayah-visual {
      font-family: 'QCF_P002', serif;
      font-size: 3em;
      line-height: 2;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Element penyimpan teks unicode */
    #ayah-unicode {
      position: absolute;
      left: -9999px;
      white-space: nowrap;
    }

    @font-face {
      font-family: 'QCF_P002';
      src: url('https://dickymiswardi.github.io/tadabbur/QCF_P002.TTF') format('truetype');
      font-display: swap;
    }
  </style>
</head>
<body>

  <h1>القرآن الكريم - نسخ تلقائي Unicode</h1>

  <div id="ayah-visual">Memuat ayat...</div>
  <div id="ayah-unicode"></div>

  <script>
    let unicodeText = "";

    // Ambil teks asli Uthmani dari API
    fetch("https://api.quran.com/api/v4/quran/verses/uthmani?verse_key=2:2")
      .then(res => res.json())
      .then(data => {
        const textUnicode = data.verse.text_uthmani;
        unicodeText = textUnicode;
        document.getElementById("ayah-unicode").innerText = unicodeText;
      });

    // Ambil glyph code_v1 untuk visual
    fetch("https://api.quran.com/api/v4/verses/by_key/2:2?words=true")
      .then(res => res.json())
      .then(data => {
        const words = data.verse.words;
        const visual = words.map(w => w.code_v1 || w.text).join(' ');
        document.getElementById("ayah-visual").innerText = visual;
      });

    // Override copy: saat user menyalin visual, yang dicopy adalah Unicode
    document.addEventListener('copy', function(e) {
      const selection = window.getSelection().toString();
      const isInsideAyah = document.getElementById("ayah-visual").innerText.includes(selection.trim());

      if (isInsideAyah && unicodeText) {
        e.clipboardData.setData('text/plain', unicodeText);
        e.preventDefault();
        console.log("📋 Clipboard diganti dengan Unicode Al-Qur'an");
      }
    });
  </script>

</body>
</html>
