<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Quran Copy Unicode + Nomor Ayat</title>
  <style>
    body {
      background: #fefdf8;
      text-align: center;
      padding: 2em;
      direction: rtl;
      font-family: sans-serif;
    }

    #ayah-visual {
      font-family: 'QCF_P002', serif;
      font-size: 3em;
      user-select: text;
    }

    #ayah-unicode {
      position: absolute;
      left: -9999px;
      white-space: nowrap;
    }

    @font-face {
      font-family: 'QCF_P002';
      src: url('https://dickymiswardi.github.io/tadabbur/QCF_P002.TTF') format('truetype');
      font-display: swap;
    }
  </style>
</head>
<body>

  <h1>نص القرآن مع رقم الآية</h1>

  <div id="ayah-visual">جارٍ التحميل...</div>
  <div id="ayah-unicode"></div>

  <script>
    const surah = 2, ayah = 2;

    // Ambil teks asli dari XML
    fetch("https://dickymiswardi.github.io/tadabbur/quran-uthmani.xml")
      .then(res => res.text())
      .then(xmlText => {
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");

        const aya = xml.querySelector(`sura[index="${surah}"] > aya[index="${ayah}"]`);
        const text = aya?.getAttribute("text") || "(Ayat tidak ditemukan)";
        document.getElementById("ayah-unicode").innerText = text;

        // Ambil visual code_v1 dari API
        fetch(`https://api.quran.com/api/v4/verses/by_key/${surah}:${ayah}?words=true`)
          .then(res => res.json())
          .then(data => {
            const words = data.verse.words;

            // Ambil code_v1 dari semua kata + token penutup (char_type_name: 'end')
            const visuals = words.map(w => w.code_v1 || w.text);
            const endWord = words.find(w => w.char_type_name === "end");
            if (endWord) {
              visuals.push(endWord.code_v1);
            } else {
              // fallback: angka Unicode di lingkaran (contoh: ayah 2 = ٢)
              visuals.push(`﴾${ayah}﴿`);
            }

            document.getElementById("ayah-visual").innerText = visuals.join(' ');
          });
      });

    // Override copy: ganti dengan teks Unicode dari XML
    document.addEventListener('copy', function (e) {
      const selection = window.getSelection().toString();
      const visualText = document.getElementById("ayah-visual").innerText;
      if (visualText.includes(selection.trim())) {
        const unicode = document.getElementById("ayah-unicode").innerText;
        e.clipboardData.setData("text/plain", unicode);
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
