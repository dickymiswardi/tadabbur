<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Al-Qur'an Dinamis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #fefcf8;
      padding: 1em;
      margin: 0;
      font-family: sans-serif;
      direction: rtl;
    }
    h2 { text-align: center; }
    .page-container {
      font-size: 2.3em;
      line-height: 1.6;
      text-align: justify;
      user-select: text;
      max-width: 1200px;
      margin: 2em auto;
      word-spacing: 0.2em;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .word {
      display: inline-block;
      position: relative;
      cursor: pointer;
      margin: 0 0.1em;
    }
    .word:hover {
      background-color: #f7eacb;
      border-radius: 6px;
    }
    .translation {
      position: absolute;
      bottom: -2.4em;
      font-size: 0.45em;
      font-family: sans-serif;
      color: #444;
      background: #fff;
      padding: 0.3em 0.6em;
      border: 1px solid #ccc;
      border-radius: 4px;
      white-space: nowrap;
      display: none;
      z-index: 10;
    }
    .word.active .translation {
      display: block;
    }
    @media (max-width: 768px) {
      .page-container { font-size: 1.5em; padding: 1em; }
    }
  </style>
</head>
<body>

  <h2 id="judul">Memuat...</h2>
  <div id="pages"></div>

  <script>
    const surah = 2;
    const fromAyah = 1;
    const toAyah = 16;
    const ayahKeys = [];
    for (let i = fromAyah; i <= toAyah; i++) {
      ayahKeys.push(`${surah}:${i}`);
    }

    let originalUnicode = "";
    let activeWord = null;
    let timeoutId = null;

    fetch("https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/ayah_page_map.json")
      .then(res => res.json())
      .then(pageMap => {
        const pageGroups = {};
        for (const key of ayahKeys) {
          const pageNum = pageMap[key];
          if (!pageGroups[pageNum]) pageGroups[pageNum] = [];
          pageGroups[pageNum].push(key);
        }

        Object.entries(pageGroups).forEach(([pageNum, keys]) => {
          const pageId = `page-${pageNum}`;
          const fontName = `QCF_P${String(pageNum).padStart(3, '0')}`;
          const fontUrl = `https://github.com/dickymiswardi/quran/raw/refs/heads/main/fonts/${fontName}.TTF`;

          const style = document.createElement('style');
          style.innerHTML = `
            @font-face {
              font-family: '${fontName}';
              src: url('${fontUrl}') format('truetype');
              font-display: swap;
            }`;
          document.head.appendChild(style);

          const container = document.createElement("div");
          container.id = pageId;
          container.className = "page-container";
          container.style.fontFamily = fontName;
          document.getElementById("pages").appendChild(container);

          Promise.all(keys.map(key =>
            fetch(`https://api.quran.com/api/v4/verses/by_key/${key}?words=true&language=id&translations=33`)
              .then(res => res.json())
          )).then(results => {
            results.forEach(data => {
              const line = document.createElement("div");
              data.verse.words.forEach(word => {
                const span = document.createElement("span");
                span.className = "word";
                span.innerText = word.code_v1 || word.text;

                const trans = document.createElement("div");
                trans.className = "translation";
                trans.innerText = word.translation?.text || "-";
                span.appendChild(trans);

                span.addEventListener("click", () => {
                  if (span === activeWord) {
                    span.classList.remove("active");
                    clearTimeout(timeoutId);
                    activeWord = null;
                    return;
                  }
                  document.querySelectorAll(".word").forEach(w => w.classList.remove("active"));
                  span.classList.add("active");
                  activeWord = span;
                  clearTimeout(timeoutId);
                  timeoutId = setTimeout(() => {
                    span.classList.remove("active");
                    activeWord = null;
                  }, 7000);
                });

                line.appendChild(span);
                line.appendChild(document.createTextNode(" "));
              });
              container.appendChild(line);
            });

            container.style.display = "block";
            requestAnimationFrame(() => {
              container.style.opacity = "1";
            });
          });
        });

        // ambil teks unicode untuk fitur copy
        fetch("https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/quran-uthmani.xml")
          .then(res => res.text())
          .then(str => (new DOMParser()).parseFromString(str, "text/xml"))
          .then(xml => {
            const sura = xml.querySelector(`sura[index="${surah}"]`);
            for (let i = fromAyah; i <= toAyah; i++) {
              const aya = sura.querySelector(`aya[index="${i}"]`);
              if (aya) originalUnicode += aya.getAttribute("text") + ` (${i}) `;
            }
            document.getElementById("judul").innerText = sura.getAttribute("name");
          });
      });

    document.addEventListener("copy", function (e) {
      if (originalUnicode) {
        e.preventDefault();
        e.clipboardData.setData("text/plain", originalUnicode.trim());
      }
    });
  </script>

</body>
</html>
