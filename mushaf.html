<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushaf Otomatis</title>
  <style>
    body {
      background: #fefcf8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      font-family: sans-serif;
    }

    .mushaf {
      width: 100%;
      max-width: 700px;
      aspect-ratio: 2 / 3;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 1em;
      display: grid;
      grid-template-rows: repeat(15, 1fr);
      box-sizing: border-box;
    }

    .line {
      text-align: justify;
      font-size: 2em;
      line-height: 1.5;
      font-family: 'QCF_AUTO';
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }

    .word {
      position: relative;
      cursor: pointer;
      margin: 0 0.1em;
    }

    .translation {
      position: absolute;
      bottom: -2.2em;
      background: #fff;
      border: 1px solid #ccc;
      font-size: 0.5em;
      padding: 0.2em 0.4em;
      border-radius: 4px;
      display: none;
    }

    .word.active .translation {
      display: block;
    }
  </style>
  <script>
    const ayat = ['2:6', '2:7', '2:8', '2:9', '2:10', '2:11', '2:12', '2:13', '2:14', '2:15', '2:16'];
    let originalText = "";

    function loadAyat() {
      fetch('https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/ayah_page_map.json')
        .then(res => res.json())
        .then(map => {
          const pages = ayat.map(key => map[key]);
          const uniquePages = [...new Set(pages)];
          if (uniquePages.length === 1) {
            const pageNumber = uniquePages[0].toString().padStart(3, '0');
            const fontUrl = `https://github.com/dickymiswardi/quran/raw/refs/heads/main/fonts/QCF_P${pageNumber}.TTF`;
            const fontFace = new FontFace('QCF_AUTO', `url(${fontUrl})`);
            document.fonts.add(fontFace);
            fontFace.load().then(() => {
              document.body.style.visibility = 'visible';
              renderAyat();
            });
          } else {
            document.body.innerHTML = '<p style="text-align:center;margin-top:2em;">❌ Ayat tidak dalam 1 halaman Mushaf.</p>';
          }
        });
    }

    function renderAyat() {
      const container = document.querySelector(".mushaf");

      Promise.all(
        ayat.map(key => fetch(`https://api.quran.com/api/v4/verses/by_key/${key}?words=true&language=id&translations=33`).then(res => res.json()))
      ).then(results => {
        results.forEach(data => {
          const line = document.createElement("div");
          line.className = "line";

          data.verse.words.forEach(word => {
            const span = document.createElement("span");
            span.className = "word";
            span.textContent = word.code_v1;

            const trans = document.createElement("div");
            trans.className = "translation";
            trans.textContent = word.translation?.text || '-';
            span.appendChild(trans);

            span.onclick = () => {
              if (span.classList.contains("active")) {
                span.classList.remove("active");
              } else {
                document.querySelectorAll(".word").forEach(w => w.classList.remove("active"));
                span.classList.add("active");
                setTimeout(() => span.classList.remove("active"), 7000);
              }
            };

            line.appendChild(span);
            line.appendChild(document.createTextNode(" "));
          });

          container.appendChild(line);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.body.style.visibility = "hidden";
      loadAyat();
    });

    document.addEventListener("copy", function (e) {
      fetch("https://raw.githubusercontent.com/dickymiswardi/tadabbur/refs/heads/main/quran-uthmani.xml")
        .then(res => res.text())
        .then(str => (new DOMParser()).parseFromString(str, "text/xml"))
        .then(xml => {
          let text = "";
          ayat.forEach(key => {
            const [surah, ayah] = key.split(":");
            const aya = xml.querySelector(`sura[index='${surah}'] > aya[index='${ayah}']`);
            if (aya) text += aya.getAttribute("text") + ` (${ayah}) `;
          });
          e.clipboardData.setData("text/plain", text.trim());
          e.preventDefault();
        });
    });
  </script>
</head>
<body>
  <div class="mushaf"></div>
</body>
</html>
