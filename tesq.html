<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Search Ayat Lokal</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f0f0f0; }
    input { width: 100%; padding: 1rem; font-size: 1.2rem; margin-bottom: 1rem; }
    .result { background: white; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; box-shadow: 0 0 5px #ccc; direction: rtl; text-align: right; }
    .meta { font-size: 0.9rem; color: #666; margin-bottom: 0.3rem; }
  </style>
</head>
<body>

<h2>🔍 Pencarian Ayat (Lokal - Quran JSON)</h2>
<input type="text" id="searchInput" placeholder="Ketik kata Arab, contoh: اللَّهِ">
<div id="results"></div>

<script>
let quranText = [];

fetch('https://unpkg.com/quran-json@1.0.1/json/quran/text.json')
  .then(res => res.json())
  .then(data => {
    quranText = data;
  });

document.getElementById('searchInput').addEventListener('input', function () {
  const keyword = this.value.trim();
  const container = document.getElementById('results');
  container.innerHTML = '';

  if (keyword.length < 2) return;

  const results = quranText.filter(ayat =>
    ayat.text.split(' ').some(kata => kata.includes(keyword))
  );

  if (results.length === 0) {
    container.innerHTML = '<p>Tidak ditemukan.</p>';
    return;
  }

  container.innerHTML = results.map(r => `
    <div class="result">
      <div class="meta">Surah ${r.chapter}, Ayat ${r.verse}</div>
      <div class="text">${r.text}</div>
    </div>
  `).join('');
});
</script>

</body>
</html>
